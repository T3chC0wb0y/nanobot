[project]
name = "nanobot-local-memory"
version = "0.1.0"
description = "Standalone local memory MCP service for Nanobot"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
]

[project.scripts]
nanobot-local-memory = "nanobot_local_memory.mcp_stdio:main"
nanobot-local-memory-cli = "nanobot_local_memory.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
